title = "My Blog"
theme = "PaperMod"
baseURL = "https://sswastioyono18.github.io/blog/"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  env = "production"
  title = "My Blog"
  description = "A personal blog about tech, engineering, and learning"
  author = "Sactios Wastioyono"
  keywords = ["Go", "Backend Engineering", "Platform Engineering", "GCP", "Databases"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Backend / Platform Engineering Notes"
    Content = "Notes on Go, databases, cloud platforms, and the tradeoffs behind production software."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sswastioyono18"

[permalinks]
  pages = "/:slug"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = 'monokailight'
    tabWidth = 4

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "atom"

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "index"

ignoreErrors = ["error-remote-getjson"]
